name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build, lint, unit, race, fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./... && go vet -tags integration,live,record ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags integration,live,record
      - name: unit
        run: make test
      - name: race
        run: make test-race
      - name: short fuzz
        run: make fuzz FUZZTIME=10s

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gasometer
          POSTGRES_PASSWORD: gasometer
          POSTGRES_DB: gasometer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gasometer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GASOMETER_TEST_DATABASE_URL: postgres://gasometer:gasometer@localhost:5432/gasometer?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: integration
        run: make integration

  image:
    name: publish image
    needs: [go, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: gasometer-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The homelab VM orders images by this label and refuses to go backwards, so it is the commit time, not the build time.
      - name: commit time
        id: created
        run: echo "ts=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/benwolfaardt/gasometer:${{ github.sha }}
            ghcr.io/benwolfaardt/gasometer:main
          labels: |
            org.opencontainers.image.source=https://github.com/BenWolfaardt/gasometer
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.ts }}
