name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build, lint, unit, race, fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./... && go vet -tags integration,live ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags integration,live
      - name: unit
        run: make test
      - name: race
        run: make test-race
      - name: short fuzz
        run: make fuzz FUZZTIME=10s

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gasometer
          POSTGRES_PASSWORD: gasometer
          POSTGRES_DB: gasometer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gasometer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GASOMETER_TEST_DATABASE_URL: postgres://gasometer:gasometer@localhost:5432/gasometer?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: integration
        run: make integration
